AWSTemplateFormatVersion: '2010-09-09'
Description: 'Serverless Product Catalog API with API Gateway, Lambda, and DynamoDB'

Parameters:
  RestApiLambdaRoleARN:
    Type: String
    Description: ARN of the IAM role for Lambda functions
    Default: ''

Resources:
  # DynamoDB Table for Items
  ItemsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Items
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      ProvisionedThroughput:
        ReadCapacityUnits: 5
        WriteCapacityUnits: 5
      Tags:
        - Key: Name
          Value: Product Catalog Items

  # REST API
  ItemsRestApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: Items
      Description: Product catalog REST API
      EndpointConfiguration:
        Types:
          - REGIONAL

  # /items Resource
  ItemsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref ItemsRestApi
      ParentId: !GetAtt ItemsRestApi.RootResourceId
      PathPart: items

  # /items/{id} Resource
  ItemIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref ItemsRestApi
      ParentId: !Ref ItemsResource
      PathPart: '{id}'

  # Lambda Function: Create Item
  CreateItemFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: CreateItemFunction
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !Ref RestApiLambdaRoleARN
      Timeout: 30
      Environment:
        Variables:
          TABLE_NAME: !Ref ItemsTable
      Code:
        ZipFile: |
          import json
          import boto3
          from decimal import Decimal
          
          dynamodb = boto3.resource('dynamodb')
          table = dynamodb.Table('Items')
          
          def lambda_handler(event, context):
              try:
                  if not event.get('body'):
                      return {
                          'statusCode': 400,
                          'headers': {'Content-Type': 'application/json', 'Access-Control-Allow-Origin': '*'},
                          'body': json.dumps({'error': 'Request body is required'})
                      }
                  
                  body = json.loads(event['body'])
                  
                  if 'id' not in body:
                      return {
                          'statusCode': 400,
                          'headers': {'Content-Type': 'application/json', 'Access-Control-Allow-Origin': '*'},
                          'body': json.dumps({'error': 'Item ID is required'})
                      }
                  
                  item = convert_floats_to_decimal(body)
                  table.put_item(Item=item)
                  
                  return {
                      'statusCode': 200,
                      'headers': {'Content-Type': 'application/json', 'Access-Control-Allow-Origin': '*'},
                      'body': json.dumps({'message': 'Item created successfully', 'item': convert_decimal_to_float(item)})
                  }
              except Exception as e:
                  print(f"Error: {str(e)}")
                  return {
                      'statusCode': 500,
                      'headers': {'Content-Type': 'application/json', 'Access-Control-Allow-Origin': '*'},
                      'body': json.dumps({'error': 'Internal server error'})
                  }
          
          def convert_floats_to_decimal(obj):
              if isinstance(obj, dict):
                  return {k: convert_floats_to_decimal(v) for k, v in obj.items()}
              elif isinstance(obj, list):
                  return [convert_floats_to_decimal(item) for item in obj]
              elif isinstance(obj, float):
                  return Decimal(str(obj))
              else:
                  return obj
          
          def convert_decimal_to_float(obj):
              if isinstance(obj, dict):
                  return {k: convert_decimal_to_float(v) for k, v in obj.items()}
              elif isinstance(obj, list):
                  return [convert_decimal_to_float(item) for item in obj]
              elif isinstance(obj, Decimal):
                  return float(obj)
              else:
                  return obj

  # Lambda Function: Read All Items
  ReadItemsFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: ReadItemsFunction
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !Ref RestApiLambdaRoleARN
      Timeout: 30
      Environment:
        Variables:
          TABLE_NAME: !Ref ItemsTable
      Code:
        ZipFile: |
          import json
          import boto3
          from decimal import Decimal
          
          dynamodb = boto3.resource('dynamodb')
          table = dynamodb.Table('Items')
          
          def lambda_handler(event, context):
              try:
                  query_params = event.get('queryStringParameters') or {}
                  limit = int(query_params.get('limit', 100))
                  
                  scan_params = {'Limit': limit}
                  
                  if 'lastKey' in query_params:
                      try:
                          last_key = json.loads(query_params['lastKey'])
                          scan_params['ExclusiveStartKey'] = last_key
                      except:
                          pass
                  
                  response = table.scan(**scan_params)
                  items = [convert_decimal_to_float(item) for item in response.get('Items', [])]
                  
                  response_body = {'items': items, 'count': len(items)}
                  
                  if 'LastEvaluatedKey' in response:
                      response_body['lastKey'] = response['LastEvaluatedKey']
                      response_body['hasMore'] = True
                  else:
                      response_body['hasMore'] = False
                  
                  return {
                      'statusCode': 200,
                      'headers': {'Content-Type': 'application/json', 'Access-Control-Allow-Origin': '*'},
                      'body': json.dumps(response_body)
                  }
              except Exception as e:
                  print(f"Error: {str(e)}")
                  return {
                      'statusCode': 500,
                      'headers': {'Content-Type': 'application/json', 'Access-Control-Allow-Origin': '*'},
                      'body': json.dumps({'error': 'Internal server error'})
                  }
          
          def convert_decimal_to_float(obj):
              if isinstance(obj, dict):
                  return {k: convert_decimal_to_float(v) for k, v in obj.items()}
              elif isinstance(obj, list):
                  return [convert_decimal_to_float(item) for item in obj]
              elif isinstance(obj, Decimal):
                  return float(obj)
              else:
                  return obj

  # Lambda Function: Read Item by ID
  ReadItemByIdFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: ReadItemByIdFunction
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !Ref RestApiLambdaRoleARN
      Timeout: 30
      Environment:
        Variables:
          TABLE_NAME: !Ref ItemsTable
      Code:
        ZipFile: |
          import json
          import boto3
          from decimal import Decimal
          
          dynamodb = boto3.resource('dynamodb')
          table = dynamodb.Table('Items')
          
          def lambda_handler(event, context):
              try:
                  path_params = event.get('pathParameters') or {}
                  item_id = path_params.get('id')
                  
                  if not item_id:
                      return {
                          'statusCode': 400,
                          'headers': {'Content-Type': 'application/json', 'Access-Control-Allow-Origin': '*'},
                          'body': json.dumps({'error': 'Item ID is required in path'})
                      }
                  
                  response = table.get_item(Key={'id': item_id})
                  
                  if 'Item' not in response:
                      return {
                          'statusCode': 404,
                          'headers': {'Content-Type': 'application/json', 'Access-Control-Allow-Origin': '*'},
                          'body': json.dumps({'error': 'Item not found', 'id': item_id})
                      }
                  
                  item = convert_decimal_to_float(response['Item'])
                  
                  return {
                      'statusCode': 200,
                      'headers': {'Content-Type': 'application/json', 'Access-Control-Allow-Origin': '*'},
                      'body': json.dumps({'item': item})
                  }
              except Exception as e:
                  print(f"Error: {str(e)}")
                  return {
                      'statusCode': 500,
                      'headers': {'Content-Type': 'application/json', 'Access-Control-Allow-Origin': '*'},
                      'body': json.dumps({'error': 'Internal server error'})
                  }
          
          def convert_decimal_to_float(obj):
              if isinstance(obj, dict):
                  return {k: convert_decimal_to_float(v) for k, v in obj.items()}
              elif isinstance(obj, list):
                  return [convert_decimal_to_float(item) for item in obj]
              elif isinstance(obj, Decimal):
                  return float(obj)
              else:
                  return obj

  # Lambda Function: Update Item
  UpdateItemFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: UpdateItemFunction
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !Ref RestApiLambdaRoleARN
      Timeout: 30
      Environment:
        Variables:
          TABLE_NAME: !Ref ItemsTable
      Code:
        ZipFile: |
          import json
          import boto3
          from decimal import Decimal
          
          dynamodb = boto3.resource('dynamodb')
          table = dynamodb.Table('Items')
          
          def lambda_handler(event, context):
              try:
                  path_params = event.get('pathParameters') or {}
                  item_id = path_params.get('id')
                  
                  if not item_id:
                      return {
                          'statusCode': 400,
                          'headers': {'Content-Type': 'application/json', 'Access-Control-Allow-Origin': '*'},
                          'body': json.dumps({'error': 'Item ID is required in path'})
                      }
                  
                  if not event.get('body'):
                      return {
                          'statusCode': 400,
                          'headers': {'Content-Type': 'application/json', 'Access-Control-Allow-Origin': '*'},
                          'body': json.dumps({'error': 'Request body is required'})
                      }
                  
                  body = json.loads(event['body'])
                  body.pop('id', None)
                  
                  if not body:
                      return {
                          'statusCode': 400,
                          'headers': {'Content-Type': 'application/json', 'Access-Control-Allow-Origin': '*'},
                          'body': json.dumps({'error': 'No attributes to update'})
                      }
                  
                  update_expression = "SET "
                  expression_attribute_names = {}
                  expression_attribute_values = {}
                  
                  for i, (key, value) in enumerate(body.items()):
                      attr_name = f"#attr{i}"
                      attr_value = f":val{i}"
                      
                      if i > 0:
                          update_expression += ", "
                      
                      update_expression += f"{attr_name} = {attr_value}"
                      expression_attribute_names[attr_name] = key
                      
                      if isinstance(value, float):
                          value = Decimal(str(value))
                      
                      expression_attribute_values[attr_value] = value
                  
                  response = table.update_item(
                      Key={'id': item_id},
                      UpdateExpression=update_expression,
                      ExpressionAttributeNames=expression_attribute_names,
                      ExpressionAttributeValues=expression_attribute_values,
                      ReturnValues='ALL_NEW'
                  )
                  
                  updated_item = convert_decimal_to_float(response['Attributes'])
                  
                  return {
                      'statusCode': 200,
                      'headers': {'Content-Type': 'application/json', 'Access-Control-Allow-Origin': '*'},
                      'body': json.dumps({'message': 'Item updated successfully', 'item': updated_item})
                  }
              except Exception as e:
                  print(f"Error: {str(e)}")
                  return {
                      'statusCode': 500,
                      'headers': {'Content-Type': 'application/json', 'Access-Control-Allow-Origin': '*'},
                      'body': json.dumps({'error': 'Internal server error'})
                  }
          
          def convert_decimal_to_float(obj):
              if isinstance(obj, dict):
                  return {k: convert_decimal_to_float(v) for k, v in obj.items()}
              elif isinstance(obj, list):
                  return [convert_decimal_to_float(item) for item in obj]
              elif isinstance(obj, Decimal):
                  return float(obj)
              else:
                  return obj

  # API Gateway Methods
  
  # POST /items
  CreateItemMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ItemsRestApi
      ResourceId: !Ref ItemsResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${CreateItemFunction.Arn}/invocations

  # GET /items
  ReadItemsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ItemsRestApi
      ResourceId: !Ref ItemsResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ReadItemsFunction.Arn}/invocations

  # GET /items/{id}
  ReadItemByIdMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ItemsRestApi
      ResourceId: !Ref ItemIdResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ReadItemByIdFunction.Arn}/invocations

  # PUT /items/{id}
  UpdateItemMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ItemsRestApi
      ResourceId: !Ref ItemIdResource
      HttpMethod: PUT
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${UpdateItemFunction.Arn}/invocations

  # Lambda Permissions
  
  CreateItemPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref CreateItemFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ItemsRestApi}/*/*

  ReadItemsPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ReadItemsFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ItemsRestApi}/*/*

  ReadItemByIdPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ReadItemByIdFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ItemsRestApi}/*/*

  UpdateItemPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref UpdateItemFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ItemsRestApi}/*/*

  # API Deployment
  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - CreateItemMethod
      - ReadItemsMethod
      - ReadItemByIdMethod
      - UpdateItemMethod
    Properties:
      RestApiId: !Ref ItemsRestApi
      StageName: prod

Outputs:
  ApiUrl:
    Description: URL of the REST API
    Value: !Sub https://${ItemsRestApi}.execute-api.${AWS::Region}.amazonaws.com/prod
    Export:
      Name: !Sub ${AWS::StackName}-API-URL

  DynamoDBTableName:
    Description: Name of the DynamoDB table
    Value: !Ref ItemsTable
    Export:
      Name: !Sub ${AWS::StackName}-Table-Name

  CreateItemFunctionArn:
    Description: ARN of CreateItemFunction
    Value: !GetAtt CreateItemFunction.Arn

  ReadItemsFunctionArn:
    Description: ARN of ReadItemsFunction
    Value: !GetAtt ReadItemsFunction.Arn

  ReadItemByIdFunctionArn:
    Description: ARN of ReadItemByIdFunction
    Value: !GetAtt ReadItemByIdFunction.Arn

  UpdateItemFunctionArn:
    Description: ARN of UpdateItemFunction
    Value: !GetAtt UpdateItemFunction.Arn
