version: 0.2

# AWS CodeBuild buildspec for unit testing
# This configuration is used in the Unit Test stage (reference)

phases:
  install:
    runtime-versions:
      python: 3.9
    commands:
      - echo "Installing dependencies for unit tests..."
      - pip install --upgrade pip
      - pip install -r requirements.txt
  
  pre_build:
    commands:
      - echo "Setting up unit test environment..."
      - export PYTHONPATH=$PYTHONPATH:$(pwd)
  
  build:
    commands:
      - echo "Running unit tests..."
      - pytest tests/ -v --tb=short --ignore=test_integration.py
      - echo "Unit tests completed"

reports:
  unit-test-report:
    files:
      - 'test-results.xml'
    file-format: 'JUNITXML'

artifacts:
  files: []

cache:
  paths:
    - '/root/.cache/pip/**/*'
