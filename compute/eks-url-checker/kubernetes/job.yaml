apiVersion: batch/v1
kind: Job
metadata:
  name: url-checker-job
  labels:
    app: url-checker
    version: v1
spec:
  # Number of times to retry on failure
  backoffLimit: 3
  
  # Clean up completed jobs after 1 hour
  ttlSecondsAfterFinished: 3600
  
  template:
    metadata:
      labels:
        app: url-checker
        version: v1
    spec:
      # Job pods should not restart on completion
      restartPolicy: Never
      
      containers:
      - name: url-checker
        # Replace with your ECR repository URI
        image: <account-id>.dkr.ecr.us-east-1.amazonaws.com/url-checker:latest
        
        # Override container command
        command: ["python"]
        args:
          - "url_checker.py"
          - "https://aws.amazon.com"
          - "https://kubernetes.io"
          - "https://github.com"
          - "https://stackoverflow.com"
        
        # Resource requests and limits
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        
        # Environment variables (optional)
        env:
        - name: ENVIRONMENT
          value: "production"
        - name: LOG_LEVEL
          value: "INFO"
      
      # Image pull policy
      imagePullPolicy: Always
