# Apache Virtual Host Configuration for Flask Application
# Place this file in /etc/httpd/conf.d/ (Amazon Linux 2)

<VirtualHost *:80>
    ServerName example.com
    ServerAlias www.example.com

    # WSGI Configuration
    WSGIDaemonProcess flaskapp user=apache group=apache threads=5 python-home=/var/www/flaskapp/venv
    WSGIScriptAlias / /var/www/flaskapp/wsgi.py

    <Directory /var/www/flaskapp>
        WSGIProcessGroup flaskapp
        WSGIApplicationGroup %{GLOBAL}
        Require all granted
    </Directory>

    # Static files
    Alias /static /var/www/flaskapp/static
    <Directory /var/www/flaskapp/static>
        Require all granted
    </Directory>

    # Logging
    ErrorLog /var/log/httpd/flaskapp-error.log
    CustomLog /var/log/httpd/flaskapp-access.log combined

    # Security headers
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-XSS-Protection "1; mode=block"
</VirtualHost>
