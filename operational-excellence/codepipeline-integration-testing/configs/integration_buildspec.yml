version: 0.2

# AWS CodeBuild buildspec for integration testing
# This configuration defines how CodeBuild executes integration tests

phases:
  install:
    # Install phase: Set up the runtime and dependencies
    runtime-versions:
      python: 3.9
    commands:
      - echo "Installing dependencies..."
      - pip install --upgrade pip
      - pip install -r requirements.txt
      - echo "Dependencies installed successfully"
  
  pre_build:
    # Pre-build phase: Set up test environment
    commands:
      - echo "Setting up test environment..."
      - export FLASK_ENV=testing
      - export PYTHONPATH=$PYTHONPATH:$(pwd)
      - echo "Test environment configured"
  
  build:
    # Build phase: Run integration tests
    commands:
      - echo "Running integration tests..."
      - pytest test_integration.py -v --tb=short
      - echo "Integration tests completed"
  
  post_build:
    # Post-build phase: Generate test reports
    commands:
      - echo "Generating test reports..."
      - |
        if [ $CODEBUILD_BUILD_SUCCEEDING -eq 1 ]; then
          echo "All integration tests passed successfully"
        else
          echo "Integration tests failed"
          exit 1
        fi

reports:
  # Test reports configuration (optional)
  integration-test-report:
    files:
      - 'test-results.xml'
    file-format: 'JUNITXML'

artifacts:
  # No artifacts needed for test stage
  files: []

cache:
  # Cache pip dependencies for faster builds
  paths:
    - '/root/.cache/pip/**/*'
